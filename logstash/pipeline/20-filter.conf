# Shippers tag each event with log_source; parsing depends on it. Each source
# ends up in its own data stream: logs-<dataset>-default.
filter {
  if [log_source] == "nginx" {
    grok {
      match => { "message" => "%{HTTPD_COMBINEDLOG}" }
      tag_on_failure => ["_grokparsefailure_nginx"]
    }

    if "_grokparsefailure_nginx" not in [tags] {
      date {
        match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
        remove_field => ["timestamp"]
      }
      useragent {
        source => "[user_agent][original]"
        target => "[user_agent]"
      }
    }

    mutate {
      add_field => { "[data_stream][dataset]" => "nginx.access" }
    }
  } else if [log_source] == "app" {
    json {
      source => "message"
      target => "app"
      tag_on_failure => ["_jsonparsefailure_app"]
    }

    if [app][time] {
      date {
        match => ["[app][time]", "ISO8601"]
        remove_field => ["[app][time]"]
      }
    }
    if [app][level] {
      mutate {
        rename => { "[app][level]" => "[log][level]" }
      }
    }

    mutate {
      add_field => { "[data_stream][dataset]" => "app" }
    }
  }

  mutate {
    remove_field => ["log_source"]
  }
}
