# Data streams use the [data_stream][dataset] set by the filter, so nginx and
# app logs land in logs-nginx.access-default and logs-app-default.
output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_namespace => "default"
  }
}
