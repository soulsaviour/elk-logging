name: elk

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.5}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      # Plain HTTP inside the Compose network; put TLS in front for anything shared.
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: -Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # One-shot: sets passwords and Elasticsearch objects, then exits.
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.5}
    entrypoint: ["bash", "/setup/setup.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?set KIBANA_SYSTEM_PASSWORD in .env}
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD:?set LOGSTASH_WRITER_PASSWORD in .env}
    volumes:
      - ./setup:/setup:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.5.5}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 30
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: creates Kibana data views once Kibana is up.
  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.5.5}
    entrypoint: ["bash", "/setup/kibana.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./setup:/setup:ro
    depends_on:
      kibana:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-9.5.5}
    environment:
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD}
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    # Beats input. Publish it (e.g. "5044:5044") to receive logs from other hosts.
    expose:
      - "5044"
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION:-9.5.5}
    # Root to read log files owned by other users; config is mounted read-only,
    # so the strict permission check on it is relaxed.
    user: root
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - demo-logs:/var/log/demo:ro
      # The registry remembers how far each file was read across restarts.
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      - logstash
    restart: unless-stopped

  # Demo traffic: docker compose --profile demo up -d
  log-generator:
    image: python:3.13-alpine
    command: ["python", "/demo/generate_logs.py", "--out", "/var/log/demo", "--rate", "5"]
    volumes:
      - ./demo:/demo:ro
      - demo-logs:/var/log/demo
    profiles: ["demo"]
    restart: unless-stopped

volumes:
  es-data:
  filebeat-data:
  demo-logs:
